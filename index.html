<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhizEats Prototype</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="favicon.png" sizes="64x64">
<link rel="icon" type="image/png" href="icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E8175D; --pink-2:#C2185B; --navy:#0B1B3F; --ink:#1B2333; --muted:#5B6475;
    --line:#E6E8EE; --bg:#EEF0F4; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{padding-bottom:64px;background:var(--bg);font-family:'Outfit',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

  /* ---------- stage ---------- */
  #stage{position:relative;margin:0 auto;width:100%;container-type:inline-size;background:#fff;box-shadow:0 0 40px rgba(11,27,63,.08);animation:fade .35s ease}
  #stage img.screen{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* 1 design px on the current screen */
  #stage{--u:calc(100cqw / var(--W))}

  .hs{position:absolute;cursor:pointer;border-radius:calc(var(--u)*6);transition:background .15s, box-shadow .15s}
  .hs:hover{background:rgba(232,23,93,.06);box-shadow:0 0 0 calc(var(--u)*1.5) rgba(232,23,93,.35)}
  body.show-hs .hs, #stage.flash .hs{background:rgba(59,130,246,.16);box-shadow:0 0 0 calc(var(--u)*1.5) rgba(59,130,246,.75)}
  #stage.flash .hs{animation:flash .9s ease}
  @keyframes flash{0%,100%{opacity:0}20%,70%{opacity:1}}

  /* HTML patches drawn over a screen (e.g. breadcrumb on Cloud Kitchen) */
  .ov{position:absolute;background:#FEFEFE;font-family:'Nunito',sans-serif}
  .ov.crop{background:none;overflow:hidden}
  .ov.crop img{position:absolute;max-width:none;height:auto;display:block}
  .ov.fact{pointer-events:none}
  .ov.yr{background:none}
  .ov.yr svg{display:block;width:100%;height:100%}
  .ov.yr text{font-family:'Nunito',sans-serif;font-weight:500;fill:#DCE1E9}
  .ov.fco{background:none}
  .ov.fco svg{display:block;width:100%;height:100%}
  .ov.fco text{font-family:'Nunito',sans-serif}
  .ov.fco .fh{font-weight:700;fill:#FFFFFF}
  .ov.fco .fi{font-weight:500;fill:#E2E6EE}
  .ov.fco .on{fill:#EA1C5E}
  .ov.photo{border-radius:calc(var(--u)*8);overflow:hidden;background:#EDEBEA}
  .ov.photo img{display:block;width:100%;height:100%;object-fit:cover}
  .crumb{position:absolute;display:flex;align-items:center;gap:calc(var(--u)*8);font-size:calc(var(--u)*13.5);font-weight:600;color:#1B2333;white-space:nowrap}
  .crumb svg{width:calc(var(--u)*17);height:calc(var(--u)*17);stroke:#1B2333}
  .crumb .chev{width:calc(var(--u)*11);height:calc(var(--u)*11);margin:0 calc(var(--u)*4)}
  .crumb .here{color:var(--pink)}
  .ptag{position:absolute;display:flex;align-items:center;gap:calc(var(--u)*10);font-size:calc(var(--u)*13.5);font-weight:800;letter-spacing:.01em;color:var(--pink);white-space:nowrap}
  .ptag svg{width:calc(var(--u)*20);height:calc(var(--u)*20);stroke:var(--pink)}

  /* dropdown menus on nav items */
  .menu{position:absolute;z-index:20;min-width:calc(var(--u)*210);background:#fff;border:1px solid var(--line);border-radius:calc(var(--u)*10);
    box-shadow:0 14px 34px rgba(11,27,63,.14);padding:calc(var(--u)*6);display:none;font-size:calc(var(--u)*14)}
  .menu.open{display:block;animation:fade .18s ease}
  .menu a{display:block;padding:calc(var(--u)*9) calc(var(--u)*12);border-radius:calc(var(--u)*7);color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer}
  .menu a:hover{background:#FDE8EF;color:var(--pink)}

  /* live form fields laid over the drawn ones */
  .fld{position:absolute;border:1px solid transparent;border-radius:calc(var(--u)*5);background:transparent;
    font:inherit;font-size:calc(var(--u)*12);color:var(--ink);padding:0 calc(var(--u)*11);outline:none;transition:background .15s,border-color .15s}
  textarea.fld{padding-top:calc(var(--u)*11);resize:none}
  select.fld{appearance:none;-webkit-appearance:none;cursor:pointer}
  .fld:focus,.fld.filled{background:#fff;border-color:var(--pink);box-shadow:0 0 0 calc(var(--u)*3) rgba(232,23,93,.12)}
  .fld.filled:not(:focus){border-color:#D5D9E2;box-shadow:none}
  .fld:not(.filled):not(:focus){color:transparent}
  .fld::placeholder{color:#8A93A5}
  .fld:not(:focus)::placeholder{color:transparent}
  select.fld option{color:var(--ink)}
  .fld.err{border-color:#EF4444 !important;background:rgba(239,68,68,.06);animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  /* ---------- toolbar ---------- */
  #bar{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;gap:6px;align-items:center;background:rgba(11,27,63,.92);
    backdrop-filter:blur(8px);color:#fff;padding:6px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px}
  #bar button,#bar select{font:inherit;color:#fff;background:transparent;border:0;padding:7px 12px;border-radius:999px;cursor:pointer}
  #bar button:hover,#bar select:hover{background:rgba(255,255,255,.12)}
  #bar button.on{background:var(--pink)}
  #bar select option{color:var(--ink)}
  #bar .sep{width:1px;height:18px;background:rgba(255,255,255,.2)}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--navy);color:#fff;
    padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- modal ---------- */
  #overlay{position:fixed;inset:0;z-index:60;background:rgba(11,27,63,.55);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
  #overlay.open{display:flex}
  .modal{position:relative;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:18px;padding:30px 28px 26px;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  .modal .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#F3F4F7;cursor:pointer;font-size:18px;color:var(--muted)}
  .modal .x:hover{background:#FDE8EF;color:var(--pink)}
  .modal .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--pink)}
  .modal h2{margin:8px 0 6px;font-size:24px;color:var(--navy);line-height:1.2}
  .modal p{margin:0 0 18px;color:var(--muted);font-size:14.5px;line-height:1.55}
  .modal .rule{width:44px;height:3px;background:var(--pink);border-radius:3px;margin:0 0 16px}
  .modal form{display:grid;gap:10px}
  .modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal input,.modal select,.modal textarea{width:100%;font:inherit;font-size:14px;padding:11px 12px;border:1px solid #D9DDE5;border-radius:9px;outline:none;color:var(--ink);background:#fff}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(232,23,93,.12)}
  .modal input.err,.modal select.err{border-color:#EF4444}
  .modal textarea{min-height:80px;resize:vertical}
  .modal label.file{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px dashed #D9DDE5;border-radius:9px;color:var(--muted);font-size:14px;cursor:pointer}
  .modal label.file:hover{border-color:var(--pink);color:var(--pink)}
  .modal label.file input{display:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px;border:0;cursor:pointer;text-decoration:none}
  .btn.primary{background:linear-gradient(90deg,#D81B60,#F0386B);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:#fff;color:var(--pink);border:1.5px solid var(--pink)}
  .btn.ghost:hover{background:#FDE8EF}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .actions .btn{flex:1}
  .center{text-align:center}
  .check{width:68px;height:68px;border-radius:50%;background:#FDE8EF;display:grid;place-items:center;margin:4px auto 12px}
  .check svg{width:34px;height:34px;stroke:var(--pink)}
  .video{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#0B1B3F,#3A1240 60%,#C2185B);display:grid;place-items:center;margin-bottom:16px;color:#fff}
  .video .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
  .small{font-size:12.5px;color:#8A93A5;text-align:center;margin-top:6px}
  @media (max-width:520px){ .modal .row{grid-template-columns:1fr} #bar .label{display:none} }
</style>
</head>
<body>

<div id="stage"></div>

<!-- colour filters for footer links (values set per screen in setFooterFilters) -->

  <button id="backBtn" title="Back">←</button>
  <span class="sep"></span>

  <span class="sep"></span>
  <button id="hsBtn" title="Show clickable areas (H)">◎ <span class="label">Hotspots</span></button>

<div id="toast"></div>
<div id="overlay"><div class="modal" id="modal"></div></div>

<script>

function removedLinksOverlay(key){

    .map(b=>({r:[b[0]-4,b[1]-4,b[2]+4,b[3]+4],html:'',bg:b[4]}));

// A piece of the screen image re-placed elsewhere (used to slide nav items over)
function cropOverlay(img,W,H,dest,sx,sy){
  const dw=dest[2]-dest[0], dh=dest[3]-dest[1];
  return {r:dest,cls:'crop',html:`<img src="images/${img}" alt="" style="width:${W/dw*100}%;left:${-sx/dw*100}%;top:${-sy/dh*100}%">`};
}

// Breadcrumb + page label in the Dine-in style. o: {r, parent, here, tag, icon, crumbTop, tagTop, scale} (omit parent for label only)
const ICONS = {

  chev:'<path d="m9 5 7 7-7 7"/>',

  handshake:'<path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/>',
  headset:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 14v3a2 2 0 0 1-2 2h-1v-6h3zM3 14v3a2 2 0 0 0 2 2h1v-6H3z"/><path d="M18 19a4 4 0 0 1-4 3h-2"/>',

};
const svgIcon=(name,cls='',sw=2)=>`<svg${cls?` class="${cls}"`:''} viewBox="0 0 24 24" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
function crumbOverlay(o){
  const s=o.scale||1, at=t=>`left:calc(var(--u)*${6/s});top:calc(var(--u)*${t/s})`;
  // scale < 1 shrinks the design unit for screens drawn at a smaller scale (Careers)
  return {r:o.r,html:`<div style="--u:calc(100cqw / var(--W) * ${s})">
    ${o.parent?`<div class="crumb" style="${at(o.crumbTop)}">${svgIcon('home')}<span>${o.parent}</span>${svgIcon('chev','chev',3)}<span class="here">${o.here}</span></div>`:''}
    <div class="ptag" style="${at(o.tagTop)}">${svgIcon(o.icon)}<span>${o.tag}</span></div></div>`};
}

const PAGES = {

function copyrightOverlay(key){
  const b=COPY_BOX[key]; if(!b) return [];
  const [x0,t,x1,bt,bg]=b, px=2, py=3, w=x1-x0+1+px*2, h=bt-t+1+py*2;
  return [{r:[x0-px,t-py,x1+1+px,bt+1+py],cls:'yr',html:
    `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><rect width="${w}" height="${h}" fill="${bg}"/>
     <text x="${px}" y="${h-py}" font-size="${(bt-t+1)/0.705}" textLength="${x1-x0+1}" lengthAdjust="spacingAndGlyphs">${COPYRIGHT_YEAR}</text></svg>`}];
}

const ORDER = ['home','features','solutions','dine-in','cafes','cloud-kitchen','pricing','about','careers','contact','demo','partner','partner-types','privacy','terms','refund'];

/* ---------- build the hotspot list for a page ---------- */
function allSpots(p){
  const s = [{r:p.logo||[18,15,270,70],go:'home'}];
  const n = p.nav, [y1,y2] = n.y;
  n.items.forEach(([key,x1,x2])=>{
    const r=[x1-8,y1,x2+8,y2];
    if(key==='solutions') s.push({r,go:'solutions',menu:SOLUTIONS_MENU});
    else if(key==='about') s.push({r,go:'about',menu:ABOUT_MENU});
    else s.push({r,go:NAV_TARGET[key]});
  });
  s.push({r:n.book,go:'demo'});
  s.push(...p.spots);

  const f = p.foot, fw=f.fw||150, cw=f.cw||175;
  const rh = footRowH(f);
  FOOT_COLS.forEach((col,ci)=>col.forEach((t,ri)=>{
    const r=footRect(p,ci,ri), foot=[ci,ri];
    s.push(t[0]==='toast'?{r,toast:t[1],foot}:{r,go:t[0],foot});
  }));
  const co=FOOT_CO[current];
  if(co) s.push({r:[co[0]-4,co[1]-4,co[0]+90,co[2]+4],go:'about',foot:[3,-1]});
  [PHONE,MAIL,SITE].forEach((h,i)=>s.push({r:[f.x[4]-6,f.crow[i]-rh/2,f.x[4]+cw,f.crow[i]+rh/2],href:h}));
  s.push({r:f.logo,go:'home'});
  LEGAL.forEach((page,i)=>s.push({r:footRect(p,LEGAL_COL,i),go:page,foot:[LEGAL_COL,i]}));
  return s;
}

/* ---------- footer active (red) link ---------- */
const LEGAL = ['privacy','terms','refund'], LEGAL_COL = 4;   // bottom bar links, treated as footer column 4
const footRowH = f => Math.min(24,(f.rows[1]-f.rows[0])-2);
function footRect(p,ci,ri){
  const f=p.foot;
  if(ci===LEGAL_COL){ const [a,b]=f.bx[ri]; return [a-4,f.by-10,b+4,f.by+10]; }
  const rh=footRowH(f), x=f.x[ci], y=f.rows[ri];
  return [x-4, y-rh/2, x+(f.fw||150), y+rh/2];
}
// Items already drawn pink in the screen image: [column, row]
const BAKED_ACTIVE = {'cloud-kitchen':[1,2]};
const RED = [234,28,94], LINK = [228,232,240];
let footActive = null;   // {page, col, row} — the footer link the user last clicked

function defaultFootActive(key){
  if(key==='about') return {col:3,row:-1};
  if(LEGAL.includes(key)) return {col:LEGAL_COL,row:LEGAL.indexOf(key)};
  for(let ci=0;ci<FOOT_COLS.length;ci++){
    const ri=FOOT_COLS[ci].findIndex(t=>t[0]===key);
    if(ri>=0) return {col:ci,row:ri};
  }
  return null;
}

// Recolour footer text in place: map the image's link colour ↔ red, keeping the anti-aliasing.
function setFooterFilters(bgCss){
  const b=bgCss.match(/\d+/g).map(v=>v/255), P=RED.map(v=>v/255), Wt=LINK.map(v=>v/255);
  const Lb=(b[0]+b[1]+b[2])/3, Lw=.9;
  const toRed=b.map((bc,c)=>{const k=(P[c]-bc)/(Lw-Lb); return [k/3,k/3,k/3,0,bc-k*Lb].join(' ');});
  const toLink=b.map((bc,c)=>{const k=(Wt[c]-bc)/(P[0]-b[0]); return [k,0,0,0,bc-k*b[0]].join(' ');});
  document.querySelector('#fRed feColorMatrix').setAttribute('values',toRed.join(' ')+' 0 0 0 1 0');
  document.querySelector('#fLink feColorMatrix').setAttribute('values',toLink.join(' ')+' 0 0 0 1 0');
}

function paintFooterActive(){
  const p=PAGES[current], co=FOOT_CO[current];
  stage.querySelectorAll('.ov.fact').forEach(el=>el.remove());
  stage.querySelectorAll('.fco text').forEach(t=>t.classList.remove('on'));
  const a=(footActive && footActive.page===current) ? footActive : defaultFootActive(current);
  const baked=BAKED_ACTIVE[current];
  const isBaked=a && baked && a.col===baked[0] && a.row===baked[1];
  const recolour=(ci,ri,filter)=>{
    const r=footRect(p,ci,ri), o=cropOverlay(p.img,p.w,p.h,r,r[0],r[1]);
    const el=document.createElement('div'); el.className='ov crop fact'; place(el,r,p);
    el.innerHTML=o.html; el.style.filter=`url(#${filter})`;
    const firstHs=stage.querySelector('.hs'); stage.insertBefore(el,firstHs);
  };
  if(baked && !isBaked) recolour(baked[0],baked[1],'fLink');
  if(!a) return;
  if(a.col===3) stage.querySelector(`.fco text[data-row="${a.row}"]`)?.classList.add('on');
  else if(!isBaked) recolour(a.col,a.row,'fRed');
}

/* ---------- render ---------- */
const stage = document.getElementById('stage');
let current = null, pendingPlan = null;

function pct(v,total){return (v/total*100)+'%'}
function place(el,r,p){
  el.style.left=pct(r[0],p.w); el.style.top=pct(r[1],p.h);
  el.style.width=pct(r[2]-r[0],p.w); el.style.height=pct(r[3]-r[1],p.h);
}

function render(key){
  const p = PAGES[key] || PAGES.home;
  key = PAGES[key] ? key : 'home';
  current = key;
  document.title = 'WhizEats — ' + p.title;
  stage.style.setProperty('--W', p.w);
  stage.style.maxWidth = (p.maxW || p.w) + 'px';
  stage.innerHTML = '';
  stage.style.animation='none'; void stage.offsetWidth; stage.style.animation='';

  const img = new Image();
  img.className='screen'; img.src='images/'+p.img; img.alt=p.title+' screen'; img.draggable=false;
  stage.appendChild(img);

  [].concat(p.overlay||[], copyrightOverlay(key), footerCompanyOverlay(key), removedLinksOverlay(key)).forEach(o=>{
    const ov=document.createElement('div'); ov.className='ov'+(o.cls?' '+o.cls:''); place(ov,o.r,p);
    if(o.bg) ov.style.background=o.bg;
    ov.innerHTML=o.html; stage.appendChild(ov);
  });

  allSpots(p).forEach(sp=>{
    const a=document.createElement('a');
    a.className='hs'; place(a,sp.r,p);
    a.setAttribute('aria-label', sp.go||sp.modal||sp.href||'action');
    if(sp.href){ a.href=sp.href; if(sp.href.startsWith('http')){a.target='_blank';a.rel='noopener';} }
    a.addEventListener('click',e=>{ if(!sp.href){e.preventDefault(); act(sp);} });
    if(sp.menu) attachMenu(a,sp,p);
    stage.appendChild(a);
  });

  if(p.form) buildForm(p);
  if(FOOT_CO[key]){ setFooterFilters(FOOT_CO[key][7]); paintFooterActive(); }
  document.getElementById('jump').value=key;
  window.scrollTo({top:0,behavior:'instant'});
}

function attachMenu(a,sp,p){
  const m=document.createElement('div'); m.className='menu';
  m.style.left=pct(sp.r[0],p.w); m.style.top=pct(sp.r[3]+4,p.h);
  sp.menu.forEach(([label,target])=>{
    const i=document.createElement('a'); i.textContent=label;
    i.addEventListener('click',e=>{e.stopPropagation(); go(target);});
    m.appendChild(i);
  });
  let t;
  const open=()=>{clearTimeout(t); stage.querySelectorAll('.menu.open').forEach(x=>x!==m&&x.classList.remove('open')); m.classList.add('open');};
  const close=()=>{t=setTimeout(()=>m.classList.remove('open'),180);};
  [a,m].forEach(el=>{el.addEventListener('mouseenter',open);el.addEventListener('mouseleave',close);});
  // touch: first tap opens the menu, second tap follows the link
  a.addEventListener('touchstart',e=>{ if(!m.classList.contains('open')){e.preventDefault(); open();} },{passive:false});
  stage.appendChild(m);
}

/* ---------- live forms ---------- */
function buildForm(p){
  const F=p.form;
  F.fields.forEach(f=>{
    let el;
    if(f.opts){
      el=document.createElement('select');
      el.innerHTML=`<option value="">${f.ph}</option>`+f.opts.map(o=>`<option>${o}</option>`).join('');
    } else if(f.area){ el=document.createElement('textarea'); el.placeholder=f.ph; }
    else { el=document.createElement('input'); el.type=f.type||'text'; el.placeholder=f.ph; if(f.type==='number') el.min=1; }
    el.className='fld'; el.name=f.name; el.dataset.form=F.id; if(f.req) el.dataset.req=1;
    place(el,f.r,p);
    const sync=()=>{el.classList.toggle('filled',!!el.value); if(el.value) el.classList.remove('err');};
    el.addEventListener('input',sync); el.addEventListener('change',sync);
    stage.appendChild(el);
  });
  if(F.id==='demo' && pendingPlan){
    const n=stage.querySelector('[name=notes]');
    n.value=`Interested in the ${pendingPlan} plan.`; n.classList.add('filled'); pendingPlan=null;
  }
  const btn=document.createElement('a'); btn.className='hs'; place(btn,F.submit,p);
  btn.setAttribute('aria-label','Submit');
  btn.addEventListener('click',e=>{e.preventDefault(); submitForm(F.id);});
  stage.appendChild(btn);
}

function submitForm(id){
  const els=[...stage.querySelectorAll(`.fld[data-form="${id}"]`)];
  const missing=els.filter(el=>el.dataset.req && !el.value.trim());
  const email=els.find(el=>el.type==='email');
  els.forEach(el=>el.classList.remove('err'));
  if(missing.length){ missing.forEach(el=>{void el.offsetWidth; el.classList.add('err');}); missing[0].focus(); toast('Please fill in the highlighted required fields.'); return; }
  if(email && !/^\S+@\S+\.\S+$/.test(email.value)){ email.classList.add('err'); email.focus(); toast('Please enter a valid email address.'); return; }
  const data=Object.fromEntries(els.map(el=>[el.name,el.value]));
  openModal(id==='demo'?'demoDone':'contactDone',data);
}

/* ---------- actions ---------- */
function act(sp){
  if(sp.plan) pendingPlan=sp.plan;
  if(sp.foot){
    footActive={page:sp.go||current, col:sp.foot[0], row:sp.foot[1]};
    if(!sp.go) paintFooterActive();   // toast links stay on this page — repaint now
  }
  if(sp.go) return go(sp.go);
  if(sp.modal) return openModal(sp.modal,sp);
  if(sp.toast) return toast(sp.toast);
  if(sp.scroll!=null){
    const p=PAGES[current], y=stage.offsetTop + sp.scroll*stage.offsetWidth/p.w;
    return window.scrollTo({top:y,behavior:'smooth'});
  }
}
function go(key){
  if('#/'+key===location.hash) render(key); else location.hash='#/'+key;
}
window.addEventListener('hashchange',()=>{ closeModal(); render(location.hash.replace('#/','')||'home'); });

/* click on a non-hotspot area → flash the hotspots (Figma-style hint) */
stage.addEventListener('click',e=>{
  if(e.target.closest('.hs,.fld,.menu')) return;
  stage.classList.remove('flash'); void stage.offsetWidth; stage.classList.add('flash');
  setTimeout(()=>stage.classList.remove('flash'),900);
});

/* ---------- toast ---------- */
let tt;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---------- modals ---------- */
const overlay=document.getElementById('overlay'), modal=document.getElementById('modal');
const CHECK=`<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>`;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const first=s=>esc(String(s||'').trim().split(/\s+/)[0]);

const MODALS={
  demoDone:d=>`${CHECK}<div class="center">
      <h2>Thank you, ${first(d.name)}!</h2>
      <p>Your demo request for <b>${esc(d.company)}</b> has been received. A WhizEats product specialist will reach out at <b>${esc(d.email)}</b> within one business day to schedule your personalised walkthrough.</p>
      <div class="actions"><button class="btn ghost" data-go="features">Explore Features</button><button class="btn primary" data-go="home">Back to Home</button></div></div>`,
  contactDone:d=>`${CHECK}<div class="center">
      <h2>Message sent!</h2>
      <p>Thanks, ${first(d.name)}. Our team has received your message about <b>${esc(d.topic.toLowerCase())}</b> and will get back to you shortly at <b>${esc(d.email)}</b>.</p>
      <div class="actions"><button class="btn ghost" data-close>Close</button><button class="btn primary" data-go="home">Back to Home</button></div></div>`,
  apply:d=>`<span class="tag">Careers</span>
      <h2>${d.job?'Apply: '+esc(d.job):'Send Us Your Resume'}</h2><div class="rule"></div>
      <p>${d.job?'Kolkata / Hybrid · Full-time. ':''}Tell us a bit about yourself and attach your resume.</p>
      <form data-kind="apply" novalidate>
        <input name="name" placeholder="Full Name*" required>
        <div class="row"><input name="email" type="email" placeholder="Email*" required><input name="phone" type="tel" placeholder="Phone Number*" required></div>
        <input name="link" placeholder="LinkedIn / Portfolio URL">
        <label class="file"><input type="file" name="cv" accept=".pdf,.doc,.docx">📎 <span>Attach resume (PDF, DOC)</span></label>
        <button class="btn primary" type="submit">Submit Application →</button>
      </form>`,
  applyDone:d=>`${CHECK}<div class="center"><h2>Application submitted!</h2>
      <p>Thanks, ${first(d.name)}. Our hiring team will review your profile and get in touch if there’s a match.</p>
      <div class="actions"><button class="btn primary" data-close>Done</button></div></div>`,
  partner:d=>`<span class="tag">Partner Program</span>
      <h2>Become a WhizEats Partner</h2><div class="rule"></div>
      <p>Grow together with us. Share a few details and our partnerships team will contact you.</p>
      <form data-kind="partner" novalidate>
        <div class="row"><input name="name" placeholder="Full Name*" required><input name="company" placeholder="Company Name*" required></div>
        <div class="row"><input name="email" type="email" placeholder="Work Email*" required><input name="phone" type="tel" placeholder="Phone Number*" required></div>
        <select name="ptype" required>
          <option value="">Partnership type*</option>
          ${['Referral Partner','Implementation Partner','Technology Partner','Strategic Partner','Consulting Partner','Industry Partner'].map(o=>`<option ${o===d.ptype?'selected':''}>${o}</option>`).join('')}
        </select>
        <textarea name="msg" placeholder="Tell us about your business (optional)"></textarea>
        <button class="btn primary" type="submit">Submit Application →</button>
      </form>`,
  partnerDone:d=>`${CHECK}<div class="center"><h2>Welcome aboard, ${first(d.name)}!</h2>
      <p>Your <b>${esc(d.ptype)}</b> application for <b>${esc(d.company)}</b> has been received. Our partnerships team will contact you within 2 business days.</p>
      <div class="actions"><button class="btn ghost" data-go="partner-types">Program Types</button><button class="btn primary" data-close>Done</button></div></div>`,
  login:()=>`<span class="tag">Partner Portal</span>
      <h2>Partner Login</h2><div class="rule"></div>
      <form data-kind="login" novalidate>
        <input name="email" type="email" placeholder="Partner Email*" required>
        <input name="password" type="password" placeholder="Password*" required>
        <button class="btn primary" type="submit">Sign In →</button>
        <div class="small">Not a partner yet? <a href="#" data-modal="partner" style="color:var(--pink)">Apply now</a></div>
      </form>`,
  video:d=>`<span class="tag">Product Tour</span>
      <h2>${esc(d.title||'WhizEats Dine-in Walkthrough')}</h2><div class="rule"></div>
      <div class="video"><div class="play"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div></div>
      <p>The recorded product tour is coming soon. Want to see it live? Book a personalised demo with our team.</p>
      <div class="actions"><button class="btn ghost" data-close>Close</button><button class="btn primary" data-go="demo">Book a Live Demo</button></div>`,
};

function openModal(name,data={}){
  modal.innerHTML=`<button class="x" data-close aria-label="Close">×</button>`+MODALS[name](data);
  overlay.classList.add('open');
  const f=modal.querySelector('input,select'); if(f && !f.value) setTimeout(()=>f.focus(),60);
  const form=modal.querySelector('form');
  if(form){
    const file=form.querySelector('input[type=file]');
    if(file) file.addEventListener('change',()=>{ file.nextElementSibling.textContent=file.files[0]?file.files[0].name:'Attach resume (PDF, DOC)'; });
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const bad=[...form.querySelectorAll('[required]')].filter(i=>!i.value.trim() || (i.type==='email' && !/^\S+@\S+\.\S+$/.test(i.value)));
      form.querySelectorAll('.err').forEach(i=>i.classList.remove('err'));
      if(bad.length){ bad.forEach(i=>i.classList.add('err')); bad[0].focus(); toast('Please complete the required fields.'); return; }
      const d=Object.fromEntries(new FormData(form));
      const kind=form.dataset.kind;
      if(kind==='login'){ closeModal(); toast('Partner portal is coming soon — thanks for signing in!'); return; }
      openModal(kind+'Done',d);
    });
  }
}
function closeModal(){ overlay.classList.remove('open'); }
overlay.addEventListener('click',e=>{
  if(e.target===overlay || e.target.closest('[data-close]')) return closeModal();
  const g=e.target.closest('[data-go]'); if(g){ closeModal(); go(g.dataset.go); }
  const m=e.target.closest('[data-modal]'); if(m){ e.preventDefault(); openModal(m.dataset.modal); }
});

/* ---------- toolbar ---------- */
const jump=document.getElementById('jump');
jump.innerHTML=ORDER.map(k=>`<option value="${k}">${PAGES[k].title}</option>`).join('');
jump.addEventListener('change',()=>go(jump.value));
document.getElementById('backBtn').addEventListener('click',()=>history.length>1?history.back():go('home'));
const hsBtn=document.getElementById('hsBtn');
function toggleHs(){ document.body.classList.toggle('show-hs'); hsBtn.classList.toggle('on'); }
hsBtn.addEventListener('click',toggleHs);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if((e.key==='h'||e.key==='H') && !e.target.closest('input,textarea,select')) toggleHs();
});

if(new URLSearchParams(location.search).has('hotspots')) toggleHs();

// preload all screens for instant navigation
ORDER.forEach(k=>{ const i=new Image(); i.src='images/'+PAGES[k].img; });

render(location.hash.replace('#/','')||'home');
</script>
</body>
